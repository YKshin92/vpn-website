name: Website preview on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['dist/**', 'tests/**', 'fixtures/**', 'tools/demo-data.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test synthetic customer and trial flows
        run: node --test tests/demo-data.test.mjs tests/portal-model.test.mjs tests/trial.test.mjs
      - name: Check browser scripts
        run: |
          node --check dist/portal.js
          node --check dist/installation.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
