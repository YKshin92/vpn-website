name: Website preview on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['partner-preview/**', 'tools/check-review-artifact.mjs', 'dist/**', 'backend/**', 'tests/**', 'fixtures/**', 'tools/demo-data.mjs', 'tools/package-public-site.mjs', 'package*.json', 'tsconfig.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Build backend types
        run: npm run build
      - name: Test synthetic flows and controllers without live services
        run: npm test
      - name: Check browser scripts
        run: |
          node --check dist/portal.js
          node --check dist/installation.js
          node --check dist/admin.js
          node --check dist/key-admin.js
      - name: Check partner review screens
        run: node tools/check-review-artifact.mjs partner-preview
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: partner-preview
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
